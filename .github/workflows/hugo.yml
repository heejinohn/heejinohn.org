# Build the site with Hugo and publish it to GitHub Pages on every push to main.
name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0   # same version as on the Mac; the theme's Sass needs the "extended" build
      PANDOC_VERSION: "3.8"   # same version as on the Mac
    steps:
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install pandoc
        run: |
          wget -O ${{ runner.temp }}/pandoc.deb https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/pandoc.deb
      - name: Install LaTeX (only the packages the CV template uses; cached between runs)
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            amsmath iftex geometry hyperref microtype upquote parskip
            etaremune fontawesome sectsty titlesec fancyhdr lastpage
            datetime fmtcount psnfss mathpazo fpl palatino
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build CV
        run: make -C cv   # edit/cv.md + edit/papers.yaml -> static/cv.pdf
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'   # other branches only test the build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
